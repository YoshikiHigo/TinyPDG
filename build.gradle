plugins {
    id 'java'
    id 'eclipse'
}

group = 'yoshikihigo'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'commons-cli:commons-cli:1.2'
    implementation 'org.xerial:sqlite-jdbc:3.8.6'
    implementation 'org.eclipse.jdt:org.eclipse.jdt.core:3.10.0'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()

    // ゴールデン再生成用フラグをテスト JVM へ引き渡す:
    //   ./gradlew test -Dtinypdg.golden=update
    systemProperty 'tinypdg.golden',
            providers.systemProperty('tinypdg.golden').getOrElse('')

    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}
