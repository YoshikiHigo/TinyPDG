plugins {
    id 'java'
    id 'eclipse'
}

group = 'yoshikihigo'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'commons-cli:commons-cli:1.11.0'
    implementation 'org.xerial:sqlite-jdbc:3.53.4.0'
    implementation 'org.eclipse.jdt:org.eclipse.jdt.core:3.46.0'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    // 残る警告は 6 件:
    //   deprecation x3 -- AST.JLS4 と SwitchCase.getExpression()。
    //                     対象言語を Java 25 へ上げる作業で解消する。
    //   this-escape x3 -- コンストラクタからオーバライド可能なメソッドを
    //                     呼んでいる箇所。構造の見直しが必要なため保留。
    options.compilerArgs << '-Xlint:all'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()

    // sqlite-jdbc はネイティブライブラリを System.load() で読み込む。
    // JDK 25 では警告止まりだが、将来のリリースでは制限メソッドが
    // ブロックされるため明示的に許可しておく (JEP 472)。
    jvmArgs '--enable-native-access=ALL-UNNAMED'

    // ゴールデン再生成用フラグをテスト JVM へ引き渡す:
    //   ./gradlew test -Dtinypdg.golden=update
    systemProperty 'tinypdg.golden',
            providers.systemProperty('tinypdg.golden').getOrElse('')

    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}
